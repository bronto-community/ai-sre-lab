AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AI SRE lab: one small EC2 instance that runs the storefront demo, reachable on
  port 80, driven from GitHub Actions through OIDC + SSM. No SSH, no AWS keys.

Parameters:
  # GitHub's immutable OIDC subjects carry owner and repo IDs. Read them with
  #   gh api repos/<owner>/<repo>/actions/oidc/customization/sub
  StorefrontSubject:
    Type: String
    Default: repo:ai-sre-lab@333312067/storefront@1385272641
    Description: ai-sre-lab/storefront; its pushes to main deploy the app.
  LabSubject:
    Type: String
    Default: repo:bronto-community@300402422/ai-sre-lab@1385261870
    Description: bronto-community/ai-sre-lab; ships the harness, runs reset/release.
  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if the account already has the GitHub OIDC provider.
  InstanceType:
    Type: String
    Default: t4g.small
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  MakeOIDC: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDC:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  # Where the lab repo drops the harness (demo/) for the instance to pick up.
  HarnessBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-harness
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub "${HarnessBucket.Arn}/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: storefront web
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSG.GroupId]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3 }
      Tags:
        - { Key: Name, Value: storefront }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker git make
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-buildx \
            https://github.com/docker/buildx/releases/download/v0.30.1/buildx-v0.30.1.linux-arm64
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          systemctl enable --now docker
          mkdir -p /opt/lab

  PublicIP:
    Type: AWS::EC2::EIP
    Properties:
      InstanceId: !Ref Instance

  # Assumed by the storefront repo's deploy workflow: may only run commands on
  # this one instance.
  StorefrontDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOIDC
                - !Ref GitHubOIDC
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "${StorefrontSubject}:ref:refs/heads/main"
      Policies:
        - PolicyName: run-on-instance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"

  # Assumed by the lab repo's workflows: ships the harness, runs reset/release.
  LabAdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOIDC
                - !Ref GitHubOIDC
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "${LabSubject}:*"
      Policies:
        - PolicyName: operate-lab
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${HarnessBucket.Arn}/*"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: "*"
              - Effect: Allow
                Action: [ec2:StartInstances, ec2:StopInstances]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"

Outputs:
  ShopUrl:
    Value: !Sub "http://${PublicIP}"
  InstanceId:
    Value: !Ref Instance
  HarnessBucket:
    Value: !Ref HarnessBucket
  StorefrontDeployRoleArn:
    Value: !GetAtt StorefrontDeployRole.Arn
  LabAdminRoleArn:
    Value: !GetAtt LabAdminRole.Arn
