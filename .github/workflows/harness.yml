name: harness

# Ship demo/ to the shop host: collector, payment-processor mock, load
# generator and the deploy script the storefront's workflow calls.
on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/harness.yml"]
  workflow_dispatch:
    inputs:
      recreate:
        description: Recreate every service at the deployed commit (after harness config changes)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency: lab

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: tar -czf demo.tgz -C demo . && aws s3 cp demo.tgz "s3://${{ vars.HARNESS_BUCKET }}/demo.tgz"
      - name: Unpack on the host
        env:
          HOST: ${{ vars.INSTANCE_ID }}
          CMD: >-
            mkdir -p /opt/storefront && cd /opt/storefront && touch .env &&
            { grep -vE '^(BRONTO_API_KEY|BRONTO_MIRROR_API_KEY|COMPOSE_FILE)=' .env || true; echo "BRONTO_API_KEY=${{ secrets.BRONTO_INGEST_KEY }}";
            if [ -n "${{ secrets.BRONTO_MIRROR_INGEST_KEY }}" ]; then echo "BRONTO_MIRROR_API_KEY=${{ secrets.BRONTO_MIRROR_INGEST_KEY }}"; echo "COMPOSE_FILE=docker-compose.yml:docker-compose.mirror.yml"; fi; } > .env.new && mv .env.new .env && chmod 600 .env &&
            aws s3 cp s3://${{ vars.HARNESS_BUCKET }}/demo.tgz /tmp/demo.tgz &&
            tar -xzf /tmp/demo.tgz && chmod +x deploy.sh setup-host.sh && ./setup-host.sh &&
            if [ -s .deploy-state ]; then ./deploy.sh $(sed -n 's/^GIT_COMMIT=//p' .deploy-state) &&
              docker compose --env-file .env --env-file .deploy-state up -d --force-recreate --no-deps collector; fi &&
            if [ "${{ inputs.recreate }}" = true ]; then docker compose --env-file .env --env-file .deploy-state up -d --no-build --force-recreate; fi
        run: .github/scripts/ssm-run.sh "$HOST" "$CMD"
