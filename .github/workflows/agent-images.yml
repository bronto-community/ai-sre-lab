name: agent images

on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: [step-1, step-2, step-3, step-4, step-7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: agent/${{ matrix.step }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bronto-community/ai-sre-agent:${{ matrix.step }}
