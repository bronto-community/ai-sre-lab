name: agent images

on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent-images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/bronto-community/ai-sre-agent

jobs:
  # Python + libraries, shared by every step.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: agent/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:base

  # Each step: base + its agent.py and prompts.
  step:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        step: [step-1, step-2, step-3, step-4, step-7]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: agent/${{ matrix.step }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.step }}
