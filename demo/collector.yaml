# Receives everything from the services and forwards it wherever you point it.
# Swapping the observability backend is this file and nothing else -- the same
# claim the lab makes about swapping the telemetry MCP server.

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }

processors:
  batch: {}
  # Traces land in Bronto's ".traces" collection; these tag them as ours.
  resource:
    attributes:
      - { key: service.namespace, value: storefront, action: upsert }
      - { key: deployment.environment, value: production, action: upsert }

exporters:
  # `docker compose logs collector` shows a line per batch, as a last resort.
  debug:
    verbosity: basic
  # Bronto EU. The key comes from .env on the host (written by the harness
  # workflow from a repo secret); it is never in git.
  otlphttp/bronto:
    endpoint: https://ingestion.eu.bronto.io
    compression: none
    headers:
      x-bronto-api-key: ${env:BRONTO_API_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/bronto]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/bronto]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/bronto]
